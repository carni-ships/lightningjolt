[package]
name = "ethrex-trace"
version = "0.1.0"
edition = "2021"

[features]
default = ["circle-binius", "metal-pairing"]  # CircleBinius for faster proving, metal pairing for GPU verification on Apple Silicon
lattice = ["jolt-evm-guest/lattice", "jolt-core/lattice"]
zkmetal = ["lattice", "jolt-evm-guest/zkmetal", "jolt-core/zkmetal"]
metal-pairing = ["jolt-evm-guest/metal-pairing", "jolt-core/metal-pairing"]
dory-prime = ["jolt-evm-guest/dory-prime"]
icicle = ["jolt-evm-guest/icicle"]
icicle-metal = ["jolt-evm-guest/icicle-metal"]
circle-binius = ["jolt-evm-guest/circle-binius", "jolt-core/circle-binius"]

[dependencies]
# Ethrex VM for EVM execution
ethrex-vm = { path = "../../ethrex/crates/vm" }
ethrex-levm = { path = "../../ethrex/crates/vm/levm" }
ethrex-common = { path = "../../ethrex/crates/common" }
ethrex-crypto = { path = "../../ethrex/crates/common/crypto", features = ["std"] }

# Jolt for proving
jolt-evm-guest = { path = "../jolt-evm/guest", features = ["host-side", "circle-binius", "lattice", "zkmetal"] }
jolt-core = { path = "../jolt-core", features = ["host", "circle-binius", "lattice", "zkmetal"] }
rand = "0.8"
ark-ff = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout" }
ark-std = { version = "0.5.0", default-features = false }

# Crypto
tiny-keccak = { version = "2.0.2", features = ["keccak"] }

# Serialization
postcard = { workspace = true, features = ["alloc"] }

# Utilities
hex.workspace = true
rayon.workspace = true

# Serialization for RPC
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19"

# HTTP client for RPC
reqwest = { version = "0.12", features = ["json", "blocking"] }

[dev-dependencies]
# For testing - minimal dependencies
ethrex-storage = { path = "../../ethrex/crates/storage" }
