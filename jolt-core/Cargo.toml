[package]
name = "jolt-core"
version = "0.1.0"
authors = [
    # author of original Spartan paper and code base
    "Srinath Setty <srinath@microsoft.com>",
    # authors who contributed to the Arkworks Spartan fork
    "Zhenfei Zhang <zhenfei.zhang@hotmail.com>",
    # authors who contributed to Lasso/Jolt
    "Michael Zhu <mzhu@a16z.com>",
    "Sam Ragsdale <sragsdale@a16z.com>",
    "Noah Citron <ncitron@a16z.com>",
    "Arasu Arun <arasu.arun5@gmail.com>",
    "Quang Dao <dvquang85@gmail.com>",
    "Andrew Tretyakov <atretyakov@a16z.com>",
    "Markos Georghiades <mgeorghiades@a16z.com>",
]
edition = "2021"
description = "The lookup singularity. Based on Spartan; built on Arkworks."
documentation = "https://github.com/a16z/jolt/README.md"
repository = "https://github.com/a16z/jolt"
license-file = "LICENSE"
keywords = ["SNARK", "cryptography", "proofs", "zkVM"]

[features]
default = ["host"]
zk = ["dory/zk"]
host = [
    "prover",
    "dep:mimalloc",
    "dep:jolt-inlines-sha2",
    "dep:jolt-inlines-keccak256",
]
prover = [
    "minimal",
    "ark-ec/parallel",
    "ark-ff/parallel",
    "ark-std/parallel",
    "dory/backends",
    "dory/cache", # This includes `parallel` feature
    "dory/disk-persistence",
    "dory-prime",  # Enable Dory-Prime for parallel proof generation
    "lattice",      # Enable lattice/NTT-based commitment for faster reduce-and-fold
    # "parallel-sumcheck",  # Disabled by default - adds overhead for small proofs
]
# Enables parallelization of sumcheck stage initialization.
# Can be disabled to reduce binary size or for platforms without threading support.
parallel-sumcheck = ["dep:rayon"]
dory-prime = ["dory/dory-prime"]
# For cross-compilation to zkVM targets (SP1) that provide their own platform runtime.
# Enables tracer/std for compilation but skips jolt-platform's getrandom/sys_rand symbols.
sp1-guest = ["ark-ec/std", "ark-ff/std", "ark-std/std", "ark-ff/asm", "dep:rayon", "tracer/std"]
# This is for building jolt-core without prover capabilities, e.g. for recursion
# jolt-core needs std and rayon to compile, so these are the minimal set of features.
minimal = ["sp1-guest", "tracer/platform-random"]
allocative = ["dep:inferno"]
monitor = ["dep:sysinfo"]
pprof = ["dep:pprof", "dep:prost"]
test_incremental = []
challenge-254-bit = []
icicle = ["dep:icicle-runtime", "dep:icicle-core", "dep:icicle-bn254"]
icicle-metal = ["icicle", "icicle-runtime/metal_backend", "icicle-bn254/metal_backend"]
metal-pairing = ["dep:metal"]
lattice = ["dory/lattice"]
zkmetal = ["lattice", "dep:zkmetal"]

[dependencies]
ark-bn254.workspace = true
jolt-optimizations.workspace = true
ark-ec.workspace = true
ark-ff.workspace = true
ark-serialize.workspace = true
ark-std.workspace = true
clap.workspace = true
fixedbitset.workspace = true
itertools.workspace = true
num-derive.workspace = true
num.workspace = true
num-traits.workspace = true
postcard = { workspace = true, features = ["use-std"] }
rand = { workspace = true, features = ["std", "std_rng"] }
rand_chacha.workspace = true
rand_core.workspace = true
rayon = { workspace = true, optional = true }
serde = { workspace = true, default-features = false }
serde_json.workspace = true
sha3.workspace = true
blake2.workspace = true
chrono.workspace = true
strum.workspace = true
strum_macros.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-chrome.workspace = true
tracing-subscriber.workspace = true
eyre.workspace = true
mimalloc = { version = "0.1", optional = true }
common.workspace = true
tracer = { workspace = true, default-features = false }
bincode.workspace = true
derive_more.workspace = true
dory.workspace = true
allocative.workspace = true
inferno = { workspace = true, optional = true }
jolt-inlines-sha2 = { workspace = true, features = ["host"], optional = true }
jolt-inlines-keccak256 = { workspace = true, features = ["host"], optional = true }
icicle-runtime = { workspace = true, optional = true }
icicle-core = { workspace = true, optional = true }
icicle-bn254 = { workspace = true, optional = true, default-features = false, features = ["msm", "g2"] }
sysinfo = { workspace = true, optional = true }
pprof = { version = "0.15", features = [
    "prost-codec",
    "flamegraph",
    "frame-pointer",
], optional = true }
prost = { version = "0.14", optional = true }
metal = { version = "0.33", optional = true }
zkmetal = { version = "0.1", git = "https://github.com/carni-ships/zkmetal", optional = true }

[package.metadata.cargo-machete]
ignored = ["prost"]

[dev-dependencies]
criterion.workspace = true
iai-callgrind.workspace = true
serial_test.workspace = true
serde_json.workspace = true
tracer = { workspace = true, default-features = false, features = [
    "std",
    "test-utils",
] }

[build-dependencies]
common.workspace = true

[[bench]]
name = "iai"
harness = false

[[bench]]
name = "commit"
harness = false

[[bench]]
name = "binding"
harness = false

[[bench]]
name = "mles_product_sum"
harness = false

[[bench]]
name = "poly_bench"
harness = false

[[bench]]
name = "polynomial_evaluation"
harness = false

[[bench]]
name = "challenge_mult_performance"
harness = false

[lib]
name = "jolt_core"
path = "src/lib.rs"

[[bin]]
name = "jolt-core"
path = "src/bin/jolt_core.rs"
required-features = ["host"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
memory-stats.workspace = true
