[package]
name = "dory-pcs"
version = "0.3.0"
edition = "2021"
rust-version = "1.75"
authors = [
    "Markos Georghiades <mgeorghiades@a16z.com>",
]
license = "Apache-2.0 OR MIT"
description = "A high performance and modular implementation of the Dory polynomial commitment scheme."
repository = "https://github.com/a16z/dory"
documentation = "https://docs.rs/dory-pcs"
readme = "README.md"
keywords = ["cryptography", "zkp", "commitment", "polynomial", "pcs"]
categories = ["cryptography", "algorithms"]
include = [
    "src/**",
    "examples/**",
    "benches/**",
    "README.md",
    "CHANGELOG.md",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "Cargo.toml",
]

[package.metadata.docs.rs]
all-features = true


[features]
default = []
zk = []
backends = ["arkworks", "disk-persistence"]
arkworks = [
    "dep:ark-bn254",
    "dep:ark-ec",
    "dep:ark-ff",
    "dep:ark-serialize",
    "dep:ark-std",
    "dep:blake2",
    "dep:digest",
    "dep:bincode",
    "dep:serde",
]
parallel = ["dep:rayon", "ark-ec?/parallel", "ark-ff?/parallel"]
cache = ["arkworks", "parallel"]
disk-persistence = []
mmap-cache = ["dep:lz4_flex", "dep:sha2", "dep:hex", "dep:memmap2"]
dory-prime = ["arkworks"]
lattice = ["arkworks"]
# ICICLE GPU acceleration for MSM operations
# Requires workspace-provided ICICLE dependencies
icicle = ["dep:icicle-runtime", "dep:icicle-core", "dep:icicle-bn254", "arkworks"]
# Metal GPU backend for ICICLE
icicle-metal = ["icicle", "icicle-runtime/metal_backend", "icicle-bn254/metal_backend"]
# CUDA GPU backend for ICICLE
icicle-cuda = ["icicle", "icicle-runtime/cuda_backend", "icicle-bn254/cuda_backend"]

[dependencies]
thiserror = "2.0"
rand_core = { version = "0.6", features = ["getrandom"] }
dory-derive = { version = "0.3.0", path = "derive" }
tracing = "0.1"

# Arkworks backend
ark-bn254 = { version = "0.5.0", optional = true }
ark-ec = { version = "0.5", optional = true }
ark-ff = { version = "0.5", optional = true }
ark-serialize = { version = "0.5", optional = true }
ark-std = { version = "0.5", optional = true }
blake2 = { version = "0.10", optional = true }
digest = { version = "0.10", optional = true }
bincode = { version = "1.3", optional = true }
serde = { version = "1.0", optional = true, features = ["derive"] }
rayon = { version = "1.10", optional = true }

# Memory-mapped setup caching
lz4_flex = { version = "0.11", optional = true }
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
memmap2 = { version = "0.9", optional = true }

# ICICLE GPU acceleration (optional - use with workspace-provided dependencies)
[target.'cfg(not(target_arch = "riscv32"))'.dependencies]
icicle-runtime = { workspace = true, optional = true }
icicle-core = { workspace = true, optional = true }
icicle-bn254 = { workspace = true, optional = true, default-features = false, features = ["msm", "g2"] }

[dev-dependencies]
rand = "0.8"
criterion = { version = "0.5", features = ["html_reports"] }
tracing-subscriber = { version = "0.3", features = ["fmt"] }
serde_json = "1.0"

[[example]]
name = "basic_e2e"
required-features = ["backends"]

[[example]]
name = "homomorphic"
required-features = ["backends"]

[[example]]
name = "non_square"
required-features = ["backends"]

[[example]]
name = "homomorphic_mixed_sizes"
required-features = ["backends"]

[[example]]
name = "zk_e2e"
required-features = ["backends", "zk"]

[[example]]
name = "zk_statistical"
required-features = ["backends", "zk"]

[[example]]
name = "export_witness"
required-features = ["backends"]

[[example]]
name = "profile_dory"
required-features = ["backends", "parallel"]

[[bench]]
name = "arkworks_proof"
harness = false
required-features = ["backends", "cache", "parallel"]

[lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"
