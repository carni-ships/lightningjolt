[package]
name = "jolt-evm-guest"
version = "0.1.0"
edition = "2021"

[features]
# Host-side API generation (needs jolt/host for macro-generated functions)
# Enable this when depending on this crate from a host binary
host-side = ["jolt/host"]
# Guest binary compilation (for RISC-V no_std)
guest = []
# Lattice commitment scheme (faster arithmetic)
lattice = ["jolt/lattice"]
# GPU acceleration via zkMetal (CPU Pippenger MSM)
zkmetal = ["jolt/zkmetal"]
# Metal GPU acceleration for BN254 pairing (Apple Silicon)
metal-pairing = ["jolt/metal-pairing"]
# Dory-Prime parallel commitment scheme
dory-prime = ["jolt/dory-prime"]
# ICICLE MSM acceleration (CPU)
icicle = ["jolt/icicle"]
# ICICLE MSM acceleration (Metal GPU)
icicle-metal = ["jolt/icicle-metal"]

[dependencies]
once_cell = { version = "1.18", default-features = false, features = ["alloc", "race"] }
jolt-evm = { path = "..", package = "jolt-evm" }
jolt = { package = "jolt-sdk", path = "../../jolt-sdk" }
